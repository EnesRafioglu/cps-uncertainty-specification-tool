<template id="element-template">
  <fieldset data-element>
    <legend>Element</legend>
    <button type="button" data-remove-element>Remove element</button>
    <br>
    <label>
      Element ID
      <input data-name="scenario.models.__model__.elements.__element__.id">
    </label>
    <br>
    <label>
      Name
      <input data-name="scenario.models.__model__.elements.__element__.name">
    </label>
    <br>
    <label>
      Symbol
      <input data-name="scenario.models.__model__.elements.__element__.symbol">
    </label>
    <br>
    <label>
      Unit
      <input data-name="scenario.models.__model__.elements.__element__.unit">
    </label>
    <br>
    <label>
      Description
      <textarea data-name="scenario.models.__model__.elements.__element__.description"></textarea>
    </label>
    <br>
    <label>
      Element kind
      <select data-element-kind>
        <option value="uncertain">Uncertain element</option>
        <option value="fixed">Fixed/reference element</option>
      </select>
    </label>

    <div data-uncertainty-block>
      <h4>Uncertainty</h4>
      <label>
        Type
        <select data-uncertainty-type data-name="scenario.models.__model__.elements.__element__.uncertainty.type">
          <option value="interval">interval</option>
          <option value="probabilistic">probabilistic</option>
          <option value="binary">binary</option>
        </select>
      </label>
      <br>
      <label>
        Source
        <input data-uncertainty-input data-name="scenario.models.__model__.elements.__element__.uncertainty.source">
      </label>

      <div data-uncertainty-fields="interval">
        <label>
          Min
          <input data-uncertainty-input data-name="scenario.models.__model__.elements.__element__.uncertainty.min" type="number" step="any">
        </label>
        <br>
        <label>
          Max
          <input data-uncertainty-input data-name="scenario.models.__model__.elements.__element__.uncertainty.max" type="number" step="any">
        </label>
      </div>

      <div data-uncertainty-fields="probabilistic">
        <input data-uncertainty-input data-name="scenario.models.__model__.elements.__element__.uncertainty.distribution" type="hidden" value="gaussian">
        <label>
          Mean
          <input data-uncertainty-input data-name="scenario.models.__model__.elements.__element__.uncertainty.mean" type="number" step="any">
        </label>
        <br>
        <label>
          Standard deviation
          <input data-uncertainty-input data-name="scenario.models.__model__.elements.__element__.uncertainty.std" type="number" step="any">
        </label>
      </div>

      <div data-uncertainty-fields="binary">
        <label>
          Option 0
          <input data-uncertainty-input data-name="scenario.models.__model__.elements.__element__.uncertainty.option_0">
        </label>
        <br>
        <label>
          Option 1
          <input data-uncertainty-input data-name="scenario.models.__model__.elements.__element__.uncertainty.option_1">
        </label>
      </div>
    </div>

    <div data-fixed-block hidden>
      <h4>Fixed/reference value</h4>
      <label>
        Fixed value
        <input data-fixed-input data-name="scenario.models.__model__.elements.__element__.fixed_value">
      </label>
    </div>

    <details data-classification-block>
      <summary>Classification</summary>
      <label>
        Development phase
        <select data-name="scenario.models.__model__.elements.__element__.classification.development_phase">
          <option value=""></option>
          <option value="Requirement Level">Requirement Level</option>
          <option value="Design-Time Level">Design-Time Level</option>
          <option value="Run-Time Level">Run-Time Level</option>
        </select>
      </label>
      <br>
      <label>
        Reducibility level
        <select data-name="scenario.models.__model__.elements.__element__.classification.reducibility_level">
          <option value=""></option>
          <option value="Fully Reducible">Fully Reducible</option>
          <option value="Partially Reducible">Partially Reducible</option>
          <option value="Irreducible">Irreducible</option>
          <option value="Unknown">Unknown</option>
        </select>
      </label>
      <br>
      <label>
        Nature
        <select data-name="scenario.models.__model__.elements.__element__.classification.nature">
          <option value=""></option>
          <option value="Aleatory">Aleatory</option>
          <option value="Epistemic">Epistemic</option>
        </select>
      </label>
      <br>
      <label>
        Kind
        <select data-name="scenario.models.__model__.elements.__element__.classification.kind">
          <option value=""></option>
          <option value="Belief Uncertainty">Belief Uncertainty</option>
          <option value="Occurrence Uncertainty">Occurrence Uncertainty</option>
          <option value="Spatiotemporal">Spatiotemporal</option>
          <option value="Behavior Uncertainty">Behavior Uncertainty</option>
          <option value="Measurement Uncertainty">Measurement Uncertainty</option>
        </select>
      </label>
      <br>
      <label>
        Atomic component type
        <select data-atomic-component-type data-name="scenario.models.__model__.elements.__element__.classification.atomic_component_type">
          <option value=""></option>
          <option value="Cyber">Cyber</option>
          <option value="Physical">Physical</option>
          <option value="Platform">Platform</option>
          <option value="Model">Model</option>
        </select>
      </label>
      <br>
      <label data-atomic-subtype="Physical" hidden>
        Physical component type
        <select data-name="scenario.models.__model__.elements.__element__.classification.physical_component_type">
          <option value=""></option>
          <option value="Electrical">Electrical</option>
          <option value="Hydraulic">Hydraulic</option>
          <option value="Mechanical">Mechanical</option>
          <option value="Thermal">Thermal</option>
          <option value="Electromagnetic">Electromagnetic</option>
        </select>
      </label>
      <br>
      <label data-atomic-subtype="Model" hidden>
        Model component type
        <select data-name="scenario.models.__model__.elements.__element__.classification.model_component_type">
          <option value=""></option>
          <option value="Machine Learning Model">Machine Learning Model</option>
          <option value="Mathematical Model">Mathematical Model</option>
          <option value="Software Architecture Model">Software Architecture Model</option>
        </select>
      </label>
      <br>
      <label>
        Composite type
        <select data-name="scenario.models.__model__.elements.__element__.classification.composite_type">
          <option value=""></option>
          <option value="Cyber-Physical">Cyber-Physical</option>
          <option value="Cyber">Cyber</option>
          <option value="Physical">Physical</option>
        </select>
      </label>
      <br>
      <label>
        Autonomy type
        <select data-name="scenario.models.__model__.elements.__element__.classification.autonomy_type">
          <option value=""></option>
          <option value="Autonomous">Autonomous</option>
          <option value="Non-Autonomous">Non-Autonomous</option>
        </select>
      </label>
      <br>
      <label>
        Location type
        <select data-location-type data-name="scenario.models.__model__.elements.__element__.classification.location_type">
          <option value=""></option>
          <option value="Parameter">Parameter</option>
          <option value="Outcome">Outcome</option>
          <option value="Inputs">Inputs</option>
          <option value="Analysis">Analysis</option>
          <option value="Context">Context</option>
          <option value="Decision Making">Decision Making</option>
          <option value="Model Uncertainty">Model Uncertainty</option>
        </select>
      </label>
      <br>
      <label data-location-subtype="Model Uncertainty" hidden>
        Model uncertainty type
        <select data-name="scenario.models.__model__.elements.__element__.classification.model_uncertainty_type">
          <option value=""></option>
          <option value="Model Input Uncertainty">Model Input Uncertainty</option>
          <option value="Model Structure Uncertainty">Model Structure Uncertainty</option>
          <option value="Model Outcome Uncertainty">Model Outcome Uncertainty</option>
        </select>
      </label>
      <br>
      <label>
        Source type
        <select data-name="scenario.models.__model__.elements.__element__.classification.source_type">
          <option value=""></option>
          <option value="Model">Model</option>
          <option value="Noise in sensing">Noise in sensing</option>
          <option value="Resources">Resources</option>
          <option value="Goal/Objectives">Goal/Objectives</option>
          <option value="Environment">Environment</option>
          <option value="Human in the Loop">Human in the Loop</option>
          <option value="Managed System Uncertainty">Managed System Uncertainty</option>
        </select>
      </label>
      <br>
      <label>
        Pattern type
        <select data-name="scenario.models.__model__.elements.__element__.classification.pattern_type">
          <option value=""></option>
          <option value="Periodic">Periodic</option>
          <option value="Persistent">Persistent</option>
          <option value="Sporadic">Sporadic</option>
          <option value="Transient">Transient</option>
          <option value="Random">Random</option>
        </select>
      </label>
      <br>
      <label>
        Perspective type
        <select data-name="scenario.models.__model__.elements.__element__.classification.perspective_type">
          <option value=""></option>
          <option value="Subjective">Subjective</option>
          <option value="Objective">Objective</option>
        </select>
      </label>
      <br>
      <label>
        Effect type
        <select data-name="scenario.models.__model__.elements.__element__.classification.effect_type">
          <option value=""></option>
          <option value="continuous non-deterministic">continuous non-deterministic</option>
          <option value="continuous probabilistic">continuous probabilistic</option>
          <option value="discrete non-deterministic">discrete non-deterministic</option>
          <option value="discrete probabilistic">discrete probabilistic</option>
        </select>
      </label>
      <br>
      <label>
        Level type
        <select data-name="scenario.models.__model__.elements.__element__.classification.level_type">
          <option value=""></option>
          <option value="0th Level">0th Level</option>
          <option value="1st Level">1st Level</option>
          <option value="2nd Level">2nd Level</option>
          <option value="3rd Level">3rd Level</option>
          <option value="4th Level">4th Level</option>
        </select>
      </label>
      <br>
      <label>
        Risk type
        <select data-name="scenario.models.__model__.elements.__element__.classification.risk_type">
          <option value=""></option>
          <option value="Low">Low</option>
          <option value="Medium">Medium</option>
          <option value="High">High</option>
          <option value="Extreme">Extreme</option>
        </select>
      </label>
      <br>
      <label>
        Risk scale
        <input data-name="scenario.models.__model__.elements.__element__.classification.risk_scale" type="number" min="0" max="100">
      </label>
    </details>
  </fieldset>
</template>
