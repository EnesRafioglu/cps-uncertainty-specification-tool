<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Generated Zonotopes</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  </head>
  <body>
    <main class="page">
      <header class="page-header">
        <h1>Generated output</h1>
      </header>

      {% if generation_result %}
        <section class="output-section">
          <div class="output-heading">
            <h2>MATLAB</h2>
            <button type="button" data-copy-target="matlab-output">Copy</button>
          </div>
          <pre id="matlab-output" class="code-block">{{ generation_result }}</pre>
        </section>
      {% else %}
        <section class="validation-output">
          <p>Generation is blocked until structural errors are fixed.</p>
          <ul>
            {% for error in validation_result.structural_errors %}
              <li>{{ error }}</li>
            {% endfor %}
          </ul>
        </section>
      {% endif %}

      <section class="output-section">
        <div class="output-heading">
          <h2>JSON</h2>
          <button type="button" data-copy-target="json-output">Copy</button>
        </div>
        <pre id="json-output" class="code-block">{{ scenario_json }}</pre>
      </section>

      <div class="actions">
        <button type="button" onclick="history.back()">Go back</button>
        <form method="get" action="{{ url_for('index') }}">
          <button type="submit">Generate new scenario</button>
        </form>
      </div>
    </main>

    <script>
      document.querySelectorAll("[data-copy-target]").forEach((button) => {
        button.addEventListener("click", async () => {
          const target = document.getElementById(button.dataset.copyTarget);
          await copyText(target.textContent);

          const originalText = button.textContent;
          button.textContent = "Copied";
          setTimeout(() => {
            button.textContent = originalText;
          }, 1200);
        });
      });

      async function copyText(text) {
        if (navigator.clipboard) {
          await navigator.clipboard.writeText(text);
          return;
        }

        const textarea = document.createElement("textarea");
        textarea.value = text;
        textarea.setAttribute("readonly", "");
        textarea.style.position = "absolute";
        textarea.style.left = "-9999px";
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand("copy");
        textarea.remove();
      }
    </script>
  </body>
</html>
