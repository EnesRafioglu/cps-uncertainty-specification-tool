<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Generated Zonotopes</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  </head>
  <body>
    <main class="page">
      <header class="page-header">
        <h1>Generated output</h1>
      </header>

      {% if generation_result %}
        <section class="output-section">
          <h2>MATLAB</h2>
          <pre class="code-block">{{ generation_result }}</pre>
        </section>
      {% else %}
        <section class="validation-output">
          <p>Generation is blocked until structural errors are fixed.</p>
          <ul>
            {% for error in validation_result.structural_errors %}
              <li>{{ error }}</li>
            {% endfor %}
          </ul>
        </section>
      {% endif %}

      <section class="output-section">
        <h2>JSON</h2>
        <pre class="code-block">{{ scenario_json }}</pre>
      </section>

      <div class="actions">
        <button type="button" onclick="history.back()">Go back</button>
        <form method="get" action="{{ url_for('index') }}">
          <button type="submit">Generate new scenario</button>
        </form>
      </div>
    </main>
  </body>
</html>
